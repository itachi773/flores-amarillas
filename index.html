<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flores Amarillas para Stephanie 🌻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #020108;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Indicador para rotar con el dedo */
    .touch-hint {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.5);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #ffd700;
      pointer-events: none;
      backdrop-filter: blur(5px);
      text-align: center;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    /* Modal Carta 3D Glassmorphism */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: rgba(15, 10, 25, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.6);
      color: #ffffff;
      padding: 35px 25px;
      border-radius: 20px;
      max-width: 380px;
      width: 85%;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
      transform: scale(0.7) translateZ(-100px);
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .card {
      transform: scale(1) translateZ(0);
    }

    .card h2 {
      font-size: 2rem;
      font-family: 'Georgia', serif;
      margin-bottom: 15px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .card p {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #e0e0e0;
    }

    .card .signature {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #ffd700;
    }

    .close-btn {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #000;
      border: none;
      padding: 10px 28px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
      transition: transform 0.2s;
    }

    .close-btn:hover {
      transform: scale(1.05);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

  <div id="webgl-container"></div>
  <div class="touch-hint">✨ Arrastra con el dedo para mover en 3D | Toca para viajar ✨</div>

  <div class="modal-overlay" id="loveModal">
    <div class="card">
      <h2>Para Stephanie 🌻</h2>
      <p>
        Steph, estas flores amarillas en esta galaxia 3D son tan radiantes e infinitas como tú. 
        Gracias por iluminar cada día, mi cachona hermosa.
      </p>
      <div class="signature">Te Amo Mucho ✨</div>
      <button class="close-btn" onclick="closeCard()">Cerrar 💛</button>
    </div>
  </div>

  <script>
    // 1. Escena, Cámara y Renderizador 3D
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020108, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const initialCamPos = { x: 0, y: 15, z: 35 };
    camera.position.set(initialCamPos.x, initialCamPos.y, initialCamPos.z);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Controles para girar con el dedo / mouse
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 60;
    controls.minDistance = 5;

    // Luces 3D
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffd700, 3, 50);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    // 2. Galaxia 3D de Partículas
    const particleCount = 4000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const colorGold = new THREE.Color(0xffd700);
    const colorWhite = new THREE.Color(0xffffff);

    for (let i = 0; i < particleCount; i++) {
      const radius = Math.pow(Math.random(), 2) * 25;
      const spinAngle = radius * 0.8;
      const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

      const randomX = (Math.random() - 0.5) * 1.5;
      const randomY = (Math.random() - 0.5) * 1.5;
      const randomZ = (Math.random() - 0.5) * 1.5;

      const x = Math.cos(branchAngle + spinAngle) * radius + randomX;
      const y = randomY;
      const z = Math.sin(branchAngle + spinAngle) * radius + randomZ;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      const mixedColor = Math.random() > 0.3 ? colorGold : colorWhite;
      colors[i * 3] = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.25,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    const galaxyPoints = new THREE.Points(geometry, particleMaterial);
    scene.add(galaxyPoints);

    // 3. Corazón 3D Central
    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, 0);
    heartShape.bezierCurveTo(0, 0.5, -0.8, 1, -1.2, 0.4);
    heartShape.bezierCurveTo(-1.5, -0.2, -0.6, -0.8, 0, -1.4);
    heartShape.bezierCurveTo(0.6, -0.8, 1.5, -0.2, 1.2, 0.4);
    heartShape.bezierCurveTo(0.8, 1, 0, 0.5, 0, 0);

    const extrudeSettings = { depth: 0.4, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.1, bevelThickness: 0.1 };
    const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
    const heartMat = new THREE.MeshPhongMaterial({ color: 0xffd700, emissive: 0xff8c00, shininess: 100 });
    const heartMesh = new THREE.Mesh(heartGeo, heartMat);
    heartMesh.scale.set(1.2, 1.2, 1.2);
    heartMesh.rotation.z = Math.PI;
    scene.add(heartMesh);

    // 4. Objetos Orbitando con Nombres (Stephanie, Steph, Cachona, etc.)
    const itemsGroup = new THREE.Group();
    scene.add(itemsGroup);

    const itemsData = [
      { text: "Stephanie 💛", radius: 8, angle: 0 },
      { text: "Steph ✨", radius: 12, angle: 1 },
      { text: "Mi Cachona 👑", radius: 15, angle: 2 },
      { text: "Eres mi sol ☀️", radius: 10, angle: 3 },
      { text: "Te Amo 💕", radius: 18, angle: 4 },
      { text: "Siempre Juntos ♾️", radius: 13, angle: 5 }
    ];

    function createTextCanvas(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(10, 10, 236, 44, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'Bold 20px Segoe UI';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);
      return canvas;
    }

    const raycastTargets = [heartMesh];

    itemsData.forEach(data => {
      const group = new THREE.Group();
      
      // Flor 3D simplificada
      const flowerGeo = new THREE.SphereGeometry(0.6, 16, 16);
      const flowerMat = new THREE.MeshPhongMaterial({ color: 0xffd700, emissive: 0xffa500 });
      const flowerMesh = new THREE.Mesh(flowerGeo, flowerMat);
      group.add(flowerMesh);

      // Sprite de texto estilo cartel 3D
      const textCanvas = createTextCanvas(data.text);
      const texture = new THREE.CanvasTexture(textCanvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(4, 1, 1);
      sprite.position.y = 1.2;
      group.add(sprite);

      group.position.x = Math.cos(data.angle) * data.radius;
      group.position.z = Math.sin(data.angle) * data.radius;
      group.position.y = (Math.random() - 0.5) * 3;

      group.userData = { radius: data.radius, angle: data.angle, speed: 0.005 };
      itemsGroup.add(group);
      raycastTargets.push(flowerMesh);
    });

    // 5. Interacción y Zoom "Viaje Espacial"
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onTouchOrClick(event) {
      const x = event.touches ? event.touches[0].clientX : event.clientX;
      const y = event.touches ? event.touches[0].clientY : event.clientY;

      mouse.x = (x / window.innerWidth) * 2 - 1;
      mouse.y = -(y / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(raycastTargets);

      if (intersects.length > 0) {
        travelToTarget(intersects[0].object);
      }
    }

    window.addEventListener('click', onTouchOrClick);

    function travelToTarget(target) {
      const targetPos = new THREE.Vector3();
      target.getWorldPosition(targetPos);

      // Animación de viaje espacial hacia el elemento con TWEEN
      new TWEEN.Tween(camera.position)
        .to({ x: targetPos.x, y: targetPos.y + 1, z: targetPos.z + 5 }, 1200)
        .easing(TWEEN.Easing.Cubic.Out)
        .onUpdate(() => controls.update())
        .onComplete(() => {
          openCard();
        })
        .start();

      new TWEEN.Tween(controls.target)
        .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 1200)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
    }

    function openCard() {
      document.getElementById('loveModal').classList.add('active');
    }

    function closeCard() {
      document.getElementById('loveModal').classList.remove('active');

      // Regresar cámara a la vista general
      new TWEEN.Tween(camera.position)
        .to(initialCamPos, 1200)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(controls.target)
        .to({ x: 0, y: 0, z: 0 }, 1200)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
    }

    // 6. Bucle de Animación 3D
    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      // Rotación suave de la galaxia
      galaxyPoints.rotation.y += 0.0008;

      // Animación del corazón central
      heartMesh.rotation.y += 0.01;
      const scale = 1.2 + Math.sin(time * 0.003) * 0.1;
      heartMesh.scale.set(scale, scale, scale);

      // Orbitación de las flores y nombres
      itemsGroup.children.forEach(child => {
        if (child.userData) {
          child.userData.angle += child.userData.speed;
          child.position.x = Math.cos(child.userData.angle) * child.userData.radius;
          child.position.z = Math.sin(child.userData.angle) * child.userData.radius;
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
